<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Club de Robotica | Iniciar sesion</title>
    <link rel="icon" type="image/png" href="assets/images/brand/logo_icono.png">

    <!-- Tipografia -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Estilos globales -->
    <link
        rel="stylesheet"
        href="css/style.css?v=2.4"
    >

    <!-- Estilos especificos de la pagina -->
    <link
        rel="stylesheet"
        href="css/pages/login.css?v=2.4"
    >

    <!-- Estilos responsive -->
    <link
        rel="stylesheet"
        href="css/responsive.css?v=2.4"
    >
</head>

<body>

    <!-- ========================================
    BARRA DE NAVEGACION
    ========================================= -->

    <header class="site-header">
        <nav class="navbar container">

            <!-- Identidad del club -->
            <a
                href="index.html"
                class="brand"
            >

                <img src="assets/images/brand/logo_icono.png" alt="Logo Club de Robótica FP-UNE" class="brand-logo">

                <span class="brand-name">
                    Club de Robotica
                </span>

            </a>

            <!-- Boton hamburguesa -->
            <button
                class="nav-toggle"
                type="button"
                aria-label="Abrir menu de navegacion"
                aria-expanded="false"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>

            <!-- Menu de navegacion -->
            <div class="nav-menu">

                <div class="nav-links">

                    <a
                        href="index.html"
                        class="nav-link"
                    >
                        Inicio
                    </a>

                    <a
                        href="objetivos.html"
                        class="nav-link"
                    >
                        Objetivos
                    </a>

                    <a
                        href="categorias.html"
                        class="nav-link"
                    >
                        Categorias
                    </a>

                    <a
                        href="contacto.html"
                        class="nav-link"
                    >
                        Contacto
                    </a>

                </div>

                <!-- Pagina actual -->
                <a
                    href="login.html"
                    class="btn btn--primary nav-login"
                >
                    Iniciar sesion
                </a>

            </div>

        </nav>
    </header>


    <!-- ========================================
    CONTENIDO PRINCIPAL
    ========================================= -->

    <main>

        <!-- ========================================
        SECCION DE INICIO DE SESION
        ========================================= -->

        <section class="login-section">

            <div class="container">

                <!-- Tarjeta principal -->
                <div class="login-card">

                    <!-- Logo circular -->
                    <div
                        class="login-card__logo"
                        aria-hidden="true"
                    >
                        <img src="assets/images/brand/logo_icono.png" alt="Logo Club de Robotica FP-UNE" class="login-card__logo-img" width="120" height="120">
                    </div>


                    <!-- Introduccion -->
                    <div class="login-card__intro">

                        <h1>
                            Iniciar sesion
                        </h1>

                        <p>
                            Si ya eres miembro del club, inicie sesion.
                        </p>

                    </div>


                    <!-- ========================================
                    FORMULARIO DE INICIO DE SESION
                    ========================================= -->

                    <form class="login-form">

                        <!-- Numero de cedula -->
                        <div class="form-group">

                            <label for="cedula">
                                Numero de cedula
                            </label>

                            <input
                                type="text"
                                id="cedula"
                                name="cedula"
                                placeholder="Ingrese su numero de cedula"
                            >

                        </div>


                        <!-- Contrasena -->
                        <div class="form-group">

                            <label for="password">
                                Contrasena
                            </label>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Ingrese su contrasena"
                            >

                        </div>


                        <!-- Mostrar contrasena -->
                        <label class="password-toggle">

                            <input
                                type="checkbox"
                                id="show-password"
                            >

                            <span>
                                Mostrar contrasena
                            </span>

                        </label>


                        <!-- Recuperacion de contrasena -->
                        <a
                            href="#"
                            class="login-form__forgot-password"
                        >
                            Olvidaste tu contrasena?
                        </a>


                        <!-- Boton principal -->
                        <button
                            type="submit"
                            class="btn btn--primary login-form__button"
                        >
                            Iniciar sesion
                        </button>

                    </form>


                    <!-- ========================================
                    NUEVOS MIEMBROS
                    ========================================= -->

                    <div class="login-card__register">

                        <p>
                            Aun no eres miembro del club?
                        </p>

                        <a
                            href="contacto.html"
                            class="btn login-card__contact-button"
                        >
                            Contactar al club
                        </a>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- JavaScript con Cache Busting -->
    <script src="js/main.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/auth.js?v=2.2"></script>
    <script src="js/pages/login.js?v=2.2"></script>
</body>
</html>
